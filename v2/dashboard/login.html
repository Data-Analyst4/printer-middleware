<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Printer Middleware v2</title>
  <style>
    body {
      font-family: Segoe UI, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
    }
    .box {
      width: 100%;
      max-width: 360px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.5rem;
    }
    h1 { margin: 0 0 .5rem; font-size: 1.35rem; }
    p { margin: 0 0 1rem; color: #94a3b8; }
    label { display: block; margin: .75rem 0 .35rem; font-size: .9rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: .65rem .75rem;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
    }
    button {
      width: 100%;
      margin-top: 1.1rem;
      padding: .75rem;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    .error {
      display: none;
      background: #450a0a;
      color: #fecaca;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: .65rem .75rem;
      margin-bottom: .75rem;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Printer Middleware v2</h1>
    <p>Sign in to open the dashboard</p>
    <div id="error" class="error"></div>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const errorEl = document.getElementById('error');
    if (params.get('error')) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Invalid username or password';
    }

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.style.display = 'none';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) {
          errorEl.style.display = 'block';
          errorEl.textContent = data.error || 'Invalid username or password';
          return;
        }
        window.location.href = '/';
      } catch (err) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'Login failed. Please try again.';
      }
    });
  </script>
</body>
</html>
