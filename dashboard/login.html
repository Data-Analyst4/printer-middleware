<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Printer Middleware</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --panel: #1c2530;
            --border: #2a3544;
            --text: #e8eef4;
            --muted: #8b9aab;
            --accent: #2dd4a8;
            --danger: #f07178;
            --font: "DM Sans", system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(900px 500px at 20% 0%, #1a3a36 0%, transparent 55%),
                radial-gradient(700px 400px at 100% 100%, #1a2838 0%, transparent 50%),
                var(--bg);
            padding: 24px;
        }
        .box {
            width: 100%;
            max-width: 400px;
            background: rgba(28, 37, 48, 0.94);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.35);
        }
        .mark {
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
        }
        h1 {
            margin: 0 0 6px;
            font-size: 1.55rem;
            letter-spacing: -0.03em;
        }
        p {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 0.95rem;
        }
        label {
            display: block;
            margin: 14px 0 6px;
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0f1419;
            color: var(--text);
            font: inherit;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            width: 100%;
            margin-top: 22px;
            background: var(--accent);
            color: #06261d;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.05); }
        .error {
            background: rgba(240, 113, 120, 0.12);
            color: var(--danger);
            border: 1px solid rgba(240, 113, 120, 0.35);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="mark">Admin Panel</div>
        <h1>Printer Middleware</h1>
        <p>Sign in to manage printers, jobs, and users</p>
        <div id="error" class="error"></div>
        <form id="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const errorEl = document.getElementById('error');
        if (params.get('error')) {
            errorEl.style.display = 'block';
            errorEl.textContent = 'Invalid username or password';
        }

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            errorEl.style.display = 'none';
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success) {
                    errorEl.style.display = 'block';
                    errorEl.textContent = data.error || 'Invalid username or password';
                    return;
                }
                window.location.href = '/';
            } catch (err) {
                errorEl.style.display = 'block';
                errorEl.textContent = 'Login failed. Please try again.';
            }
        });
    </script>
</body>
</html>
